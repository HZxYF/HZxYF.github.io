<!DOCTYPE html>
<html>

<head>
    <title>孔宏泽的第一个网页</title>

    <style>
        body {
            background-image: url("photo.jpg.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            color: white;
            text-align: center;
        }

        h1 {
            font-size: 50px;
        }

        p {
            font-size: 22px;
        }

        .card {
            background: rgba(0, 0, 0, 0.5);
            padding: 40px;
            width: 500px;
            margin: 150px 100px 150px auto;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>我的宝宝</h1>

        <p>李怡菲大美女</p >
        <p>我爱李怡菲</p >

        <!-- 在一起的天数 -->
        <p id="days-counter"></p>

        <script>
            // 在一起的日期：2024年5月15日（月份从0开始，所以5月写成4）
            var startDate = new Date(2024, 4, 15);

            function updateCounter() {
                var now = new Date();
                var diff = now - startDate; // 毫秒差

                var days = Math.floor(diff / (1000 * 60 * 60 * 24));
                var hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
                var minutes = Math.floor(diff / (1000 * 60)) % 60;
                var seconds = Math.floor(diff / 1000) % 60;

                document.getElementById("days-counter").innerText =
                    "我们已经在一起 " + days + " 天 " + hours + " 小时 " +
                    minutes + " 分 " + seconds + " 秒 ❤";
            }

            updateCounter();               // 先立刻显示一次
            setInterval(updateCounter, 1000); // 之后每秒刷新一次
        </script>

        <h2>我的网站</h2>

        <a href=" " target="_blank">
            访问 Google
        </a >

        <br><br>

        <a href="https://www.youtube.com" target="_blank">
            访问油管
        </a >

        <br><br>

        <a href="https://github.com" target="_blank">
            访问 Github
        </a >

        <h2>我的技能</h2>

        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>

        <h2>我的学习计划</h2>

        <ol>
            <li>学会 HTML</li>
            <li>学会 CSS</li>
            <li>学会 JavaScript</li>
            <li>做出自己的网页</li>
        </ol>

        <form>

            <h2>给我留言</h2>

            <input type="text" placeholder="请输入你的名字">

            <br><br>

            <textarea placeholder="请输入你的留言"></textarea>

            <br><br>

            <button>提交</button>

        </form>

    </div>

</body>

</html>
